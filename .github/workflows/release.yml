name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PACKAGE_ID: WindowSillAiLimits
  PROJECT_PATH: src/WindowSillAiLimits/WindowSillAiLimits.csproj
  SOLUTION_PATH: WindowSillAiLimits.slnx
  TEST_PROJECT_PATH: tests/WindowSillAiLimits.Tests/WindowSillAiLimits.Tests.csproj

jobs:
  build:
    name: Build and validate package
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Validate tag and project version
        id: version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
          PROJECT_PATH: ${{ env.PROJECT_PATH }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:TAG_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?)$') {
              throw "Release tags must use vX.Y.Z or vX.Y.Z-prerelease format. Got: $env:TAG_NAME"
          }

          $packageVersion = $Matches.version
          [xml] $project = Get-Content -LiteralPath $env:PROJECT_PATH -Raw
          $declaredVersion = $project.Project.PropertyGroup |
              ForEach-Object { $_.Version } |
              Where-Object { $_ } |
              Select-Object -First 1

          if ($declaredVersion -ne $packageVersion) {
              throw "Tag $env:TAG_NAME does not match $env:PROJECT_PATH version $declaredVersion."
          }

          "package_version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Build Release
        run: dotnet build "${{ env.SOLUTION_PATH }}" -c Release --no-restore

      - name: Run tests
        run: dotnet test "${{ env.SOLUTION_PATH }}" -c Release --no-restore

      - name: Run local harness
        run: dotnet run --project "${{ env.TEST_PROJECT_PATH }}" -c Release --no-restore

      - name: Inspect package
        shell: pwsh
        run: ./scripts/validate-package.ps1

      - name: Prepare release assets
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          PACKAGE_ID: ${{ env.PACKAGE_ID }}
        run: |
          $ErrorActionPreference = "Stop"

          $artifactRoot = Join-Path $PWD "artifacts"
          $wsextPath = Join-Path $artifactRoot "$env:PACKAGE_ID.$env:PACKAGE_VERSION.wsext"
          $nupkgPath = Join-Path $artifactRoot "$env:PACKAGE_ID.$env:PACKAGE_VERSION.nupkg"

          foreach ($path in @($wsextPath, $nupkgPath)) {
              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Expected release asset was not generated: $path"
              }
          }

          $hash = (Get-FileHash -LiteralPath $wsextPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$wsextPath.sha256"
          $fileName = Split-Path -Leaf $wsextPath
          Set-Content -LiteralPath $checksumPath -Value "$hash  $fileName" -Encoding ascii

          Get-ChildItem -LiteralPath $artifactRoot -Filter "$env:PACKAGE_ID.$env:PACKAGE_VERSION.*" -File |
              Sort-Object Name |
              Select-Object Name, Length

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            artifacts/${{ env.PACKAGE_ID }}.${{ steps.version.outputs.package_version }}.wsext
            artifacts/${{ env.PACKAGE_ID }}.${{ steps.version.outputs.package_version }}.nupkg
            artifacts/${{ env.PACKAGE_ID }}.${{ steps.version.outputs.package_version }}.wsext.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    runs-on: windows-latest
    needs: build
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release-assets

      - name: Validate downloaded assets
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
          PACKAGE_ID: ${{ env.PACKAGE_ID }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:TAG_NAME -ne "v$env:PACKAGE_VERSION") {
              throw "Release tag $env:TAG_NAME does not match package version $env:PACKAGE_VERSION."
          }

          $assetRoot = Join-Path $PWD "release-assets"
          $wsextPath = Join-Path $assetRoot "$env:PACKAGE_ID.$env:PACKAGE_VERSION.wsext"
          $nupkgPath = Join-Path $assetRoot "$env:PACKAGE_ID.$env:PACKAGE_VERSION.nupkg"
          $checksumPath = "$wsextPath.sha256"

          foreach ($path in @($wsextPath, $nupkgPath, $checksumPath)) {
              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Release asset is missing after download: $path"
              }
          }

          $expectedHash = (Get-Content -LiteralPath $checksumPath -Raw).Trim() -split '\s+' | Select-Object -First 1
          $actualHash = (Get-FileHash -LiteralPath $wsextPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash.ToLowerInvariant()) {
              throw "Checksum mismatch for $wsextPath."
          }

      - name: Generate artifact provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            release-assets/*.wsext
            release-assets/*.nupkg

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
        run: |
          $ErrorActionPreference = "Stop"

          $assetRoot = Join-Path $PWD "release-assets"
          $notesPath = Join-Path $PWD "release-notes.md"
          $checksumFile = Get-ChildItem -LiteralPath $assetRoot -Filter "*.sha256" -File | Select-Object -First 1
          $checksumText = Get-Content -LiteralPath $checksumFile.FullName -Raw

          @(
              "# WindowSill AI Limits $env:PACKAGE_VERSION"
              ""
              "Install with:"
              ""
              '```pwsh'
              "irm https://raw.githubusercontent.com/franciscoaccabral/windowsill-ai-limits/main/scripts/install.ps1 | iex"
              '```'
              ""
              "Pinned install:"
              ""
              '```pwsh'
              "& ([scriptblock]::Create((irm https://raw.githubusercontent.com/franciscoaccabral/windowsill-ai-limits/main/scripts/install.ps1))) -Version $env:TAG_NAME"
              '```'
              ""
              "SHA256:"
              ""
              '```text'
              $checksumText.Trim()
              '```'
          ) | Set-Content -LiteralPath $notesPath -Encoding utf8

          $assets = Get-ChildItem -LiteralPath $assetRoot -File |
              Where-Object { $_.Name -like "*.wsext" -or $_.Name -like "*.nupkg" -or $_.Name -like "*.sha256" } |
              Sort-Object Name |
              ForEach-Object { $_.FullName }

          gh release create $env:TAG_NAME @assets `
              --repo $env:GITHUB_REPOSITORY `
              --title "WindowSill AI Limits $env:PACKAGE_VERSION" `
              --notes-file $notesPath `
              --verify-tag
